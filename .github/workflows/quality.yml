name: Quality Check
on: [pull_request]
env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: false
jobs:
  lint:
    name: Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Use node_modules cache
        uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node22.23.4-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install deps
        run: yarn

      - name: Build the code
        run: yarn build:ci

      - name: Run ESLint
        run: yarn lint:ci
